  <!-- Desktop / Testing Helper Bar (hidden on narrow mobile viewports) -->
  <aside class="desktop-sim-bar" aria-label="Bảng điều khiển mô phỏng trên máy tính">
    <div class="sim-bar-brand">
      <strong>Mô phỏng Tuổi Bạc</strong>
      <span>Khung điện thoại 480px (Mobile-First PWA + Realtime)</span>
    </div>
    <div class="sim-bar-controls">
      <button type="button" class="sim-chip" id="sim-open-temple">Viếng Chùa Chánh Điện</button>
      <button type="button" class="sim-chip" id="sim-open-groups">Hội Đồng Ngũ &amp; Kết bạn</button>
      <button type="button" class="sim-chip" id="sim-open-xiangqi">Cờ tướng 9×10 &amp; Cờ thế</button>
      <button type="button" class="sim-chip" id="sim-toggle-render">Đồ họa: Không gian 3D</button>
      <button type="button" class="sim-chip" id="sim-toggle-font">Cỡ chữ: 20px</button>
      <button type="button" class="sim-chip" id="sim-open-dict">Sổ từ điển tự học (8)</button>
      <button type="button" class="sim-chip" id="sim-voice-sample">Thử giọng nói mẫu</button>
      <button type="button" class="sim-chip" id="sim-trigger-idle60">Thử Trợ lý gợi chuyện 60s</button>
      <button type="button" class="sim-chip" id="sim-trigger-eyecare">Thử nhắc nghỉ mắt 20 phút</button>
      <button type="button" class="sim-chip" id="sim-open-privacy">Chỉ số &amp; Quyền riêng tư</button>
      <button type="button" class="sim-chip" id="sim-open-family">Góc nhìn Con cái</button>
      <button type="button" class="sim-chip" id="sim-reset-demo">Đặt lại dữ liệu mẫu</button>
    </div>
  </aside>

  <!-- Primary Mobile Frame -->
  <div class="phone-shell">
    <header class="app-topbar">
      <div class="topbar-left">
        <button type="button" class="btn-back" id="btn-back" hidden aria-label="Quay về màn hình chính">
          <svg class="ico">
            <use href="#ico-back" />
          </svg>
          <span>Quay về</span>
        </button>
        <div class="brand-compact" id="brand-compact">
          <span class="brand-mark" aria-hidden="true">TB</span>
          <div class="brand-text">
            <strong>Tuổi Bạc</strong>
            <small id="topbar-sub">Chưa điểm danh sáng nay</small>
          </div>
        </div>
      </div>

      <div class="topbar-actions">
        <button type="button" class="btn-tool" id="btn-read-screen" aria-label="Đọc to màn hình hiện tại">
          <svg class="ico">
            <use href="#ico-speaker" />
          </svg>
          <span>Đọc to</span>
        </button>
        <button type="button" class="btn-tool" id="btn-font-toggle" aria-label="Đổi cỡ chữ to hơn">
          <svg class="ico">
            <use href="#ico-font" />
          </svg>
          <span id="font-label">Chữ to</span>
        </button>
      </div>
    </header>

    <!-- User Status Strip -->
    <div class="user-strip" id="user-strip">
      <button type="button" class="user-pill" id="btn-go-profile">
        <span class="avatar-dot" id="strip-avatar">A</span>
        <span class="user-pill-info">
          <strong id="strip-name">Anh Tám Vườn · 65t</strong>
          <small id="strip-province">Cần Thơ</small>
        </span>
      </button>
      <div class="strip-counters">
        <button type="button" class="rt-pill" id="btn-realtime-status"
          title="Trạng thái kết nối phòng chung thời gian thực">
          <span class="rt-dot" id="strip-rt-dot"></span>
          <span id="strip-rt-label">Trực tuyến</span>
        </button>
        <span class="coin-pill" title="Xu sinh hoạt">
          <svg class="ico ico-sm">
            <use href="#ico-coin" />
          </svg>
          <span class="num" id="strip-xu">35</span>
          <span>Xu</span>
        </span>
      </div>
    </div>

    <!-- Main Dynamic View -->
    <main class="app-main" id="app-main" tabindex="-1"></main>
  </div>

  <!-- Global Accessible Dialog Overlay (Eye rest, Logs, Report, Card Preview, Dictionary) -->
  <dialog class="tb-dialog" id="tb-dialog" aria-labelledby="tb-dialog-title">
    <div class="tb-dialog-inner">
      <div class="tb-dialog-head">
        <h2 id="tb-dialog-title">Thông báo</h2>
        <button type="button" class="btn-close-dialog" id="tb-dialog-close">Đóng</button>
      </div>
      <div class="tb-dialog-body" id="tb-dialog-body"></div>
    </div>
  </dialog>

  <!-- Toast Banner -->
  <div class="toast-banner" id="toast-banner" role="status" aria-live="polite" hidden></div>
</body>

</html>
