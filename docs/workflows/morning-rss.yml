name: Morning Newspaper RSS Drafts (05:30 VN)

on:
  schedule:
    # 22:30 UTC = 05:30 sáng giờ Việt Nam (UTC+7) mỗi ngày
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-morning-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull & sanitize positive Vietnamese morning RSS drafts
        run: node scripts/fetch-morning-rss.mjs

      - name: Commit updated morning-rss.json if changed
        run: |
          if [[ -n "$(git status --porcelain assets/morning-rss.json)" ]]; then
            git config user.name "tuoibac-bot"
            git config user.email "bot@tuoibac.local"
            git add assets/morning-rss.json
            git commit -m "chore(rss): cap nhat ban nhap To Bao Sang 05:30"
            git push
          else
            echo "Khong co thay doi moi trong assets/morning-rss.json"
          fi
